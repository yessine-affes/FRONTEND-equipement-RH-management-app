<div class="surface-section p-4 md:p-6 lg:p-8">
    <div class="font-medium text-3xl text-primary mb-4">
        <p-toast></p-toast>
        <i class="pi pi-cog mr-2" style="height: 30px; width: 40px; font-size: 40px;"></i>
        Edit Equipment
    </div>
    <div class="text-secondary mb-6">Fill the fields you want to edit.</div>
  
    <div class="surface-card p-5 shadow-2 border-round p-fluid">
        
        <div class="field mb-4">
            <label for="photo">Photo</label>
            <input type="file" id="photo" (change)="onFileChange($event)" />
            <div *ngIf="imageError">
                <small class="p-error">{{ imageError }}</small>
            </div>
        </div>
  
        <div class="field mb-4">
            <label for="name">Name</label>
            <input type="text" pInputText id="name" [(ngModel)]="equip.name" required [ngClass]="{'ng-invalid ng-dirty': submitted && !equip.name}" />
            <small class="p-error" *ngIf="submitted && !equip.name">Name is required.</small>
        </div>
  
        <div class="field mb-4">
            <label for="status">Status</label>
            <p-dropdown [(ngModel)]="equip.status" inputId="status" [options]="statuses" placeholder="Select Status">
                <ng-template pTemplate="selectedItem">
                    <span>{{ equip.status }}</span>
                </ng-template>
                <ng-template let-option pTemplate="item">
                    <span>{{ option.label }}</span>
                </ng-template>
            </p-dropdown>
            <small class="p-error" *ngIf="submitted && !equip.status">Status is required.</small>
        </div>
  
        <div class="field mb-4">
            <label for="type">Type</label>
            <input type="text" pInputText id="type" [(ngModel)]="equip.type" required [ngClass]="{'ng-invalid ng-dirty': submitted && !equip.type}" />
            <small class="p-error" *ngIf="submitted && !equip.type">Type is required.</small>
        </div>
        
        <div class="field">
            <label for="availability">Availability</label>
            <p-dropdown 
                [options]="availabilityOptions" 
                [(ngModel)]="equip.availability" 
                optionLabel="label" 
                optionValue="value" 
                placeholder="Select Availability">
            </p-dropdown>
        </div>
        
    
  
        <div class="field mb-4">
            <label for="maintenanceSchedule">Maintenance Schedule</label>
            <p-calendar [(ngModel)]="equip.maintenanceSchedule" showIcon="true"></p-calendar>
        </div>
  
        <div class="flex justify-between mt-4">
            <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-text p-button-danger box-btn mr-3" (click)="navigateToEquipementsTable()"></button>
            <button pButton pRipple label="Save" icon="pi pi-check" class="p-button-text p-button-success box-btn" (click)="saveEditEquip()"></button>
        </div>
        
  
    </div>
  </div>
