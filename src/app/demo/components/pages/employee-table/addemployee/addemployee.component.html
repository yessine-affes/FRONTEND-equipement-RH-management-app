<div class="surface-section p-4 md:p-6 lg:p-8">
    <div class="font-medium text-3xl text-primary mb-4">
        <p-toast></p-toast>
        <i class="pi pi-user mr-2" style="height: 30px; width: 40px; font-size: 40px;"></i>
        Add Employee 
      </div>
      <div class="text-secondary mb-6">Fill all the fields.</div>

  <div class="surface-card p-5 shadow-2 border-round p-fluid">
    
    <div class="field mb-4">
      <label for="email">Email</label>
      <input type="email" pInputText id="email" [(ngModel)]="employee.email" required [ngClass]="{'ng-invalid ng-dirty': submitted && !employee.email}" />
      <small class="p-error" *ngIf="submitted && !employee.email">Email is required.</small>
    </div>

    <div class="field mb-4">
      <label for="first_name">First Name</label>
      <input type="text" pInputText id="first_name" [(ngModel)]="employee.first_name" required [ngClass]="{'ng-invalid ng-dirty': submitted && !employee.first_name}" />
      <small class="p-error" *ngIf="submitted && !employee.first_name">First name is required.</small>
    </div>

    <div class="field mb-4">
      <label for="last_name">Last Name</label>
      <input type="text" pInputText id="last_name" [(ngModel)]="employee.last_name" required [ngClass]="{'ng-invalid ng-dirty': submitted && !employee.last_name}" />
      <small class="p-error" *ngIf="submitted && !employee.last_name">Last name is required.</small>
    </div>

    <div class="field mb-4">
      <label for="photo">Photo</label>
      <input type="file" id="photo" class="input-file ml-2" (change)="onFileChange($event)" />
      <div *ngIf="imageError">
        <small class="p-error">{{ imageError }}</small>
      </div>
    </div>

    <div class="field mb-4">
      <label for="speciality">Speciality</label>
      <p-dropdown [options]="specialities" [(ngModel)]="employee.speciality" placeholder="Select Speciality" class="w-full"></p-dropdown>
    </div>

    <div class="field mb-4">
      <label for="score">Score</label>
      <p-inputNumber id="score" [(ngModel)]="employee.score" min="0" class="w-full"></p-inputNumber>
    </div>

    <div class="field mb-4">
      <label for="availability">Availability</label>
      <div class="flex gap-4 mt-2">
        <p-radioButton name="availability" value="1" [(ngModel)]="employee.availability" label="Yes" class="p-radioButton-sm"></p-radioButton>
        <p-radioButton name="availability" value="0" [(ngModel)]="employee.availability" label="No" class="p-radioButton-sm"></p-radioButton>
      </div>
    </div>

    
    <div class="flex justify-between mt-4">
      <!-- Cancel Button -->
      <button 
          pButton 
          pRipple 
          type="button" 
          label="Cancel" 
          icon="pi pi-times" 
          class="p-button-text p-button-danger box-btn mr-3" 
          (click)="cancel()">
      </button>
  
      <!-- Save Button -->
      <button 
          pButton 
          pRipple 
          type="submit" 
          label="Save" 
          icon="pi pi-check" 
          class="p-button-text p-button-success box-btn" 
          (click)="saveEmployee()">
      </button>
  </div>
      
  <div class="mt-2 flex justify-between ">
      <button pButton label="Add Certification" icon="pi pi-file" class="p-button-info mt-4"
        (click)="openAddCertificationDialog()"></button>
  </div>
  </div>
</div>
 <!-- Add Certification Dialog -->
 <p-dialog [(visible)]="certificationAddDialog" [style]="{width: '600px'}" header="Add Certification" [modal]="true"
 class="p-fluid">
 <ng-template pTemplate="content">
   <div class="field">
     <label for="certificationName">Certification Name</label>
     <input type="text" pInputText id="certificationName" [(ngModel)]="newCertification.name" required />
   </div>
  
   <div class="field">
     <label for="issuedDate">Issued Date</label>
     <p-calendar id="issuedDate" [(ngModel)]="newCertification.issued_date" dateFormat="mm/dd/yy"
       required></p-calendar>
   </div>
   <div class="field">
     <label for="expiryDate">Expiry Date</label>
     <p-calendar id="expiryDate" [(ngModel)]="newCertification.expiry_date" dateFormat="mm/dd/yy"
       required></p-calendar>
   </div>
   <div class="field">
     <label for="description">Description</label>
     <textarea id="description" pInputText [(ngModel)]="newCertification.description" rows="3" required></textarea>
   </div>
   <div class="field">
     <label for="status">Status</label>
     <input type="text" pInputText id="status" [(ngModel)]="newCertification.status" required />
   </div>
 </ng-template>
 <ng-template pTemplate="footer">
   <button pButton label="Cancel" icon="pi pi-times" class="p-button-text"
     (click)="hideCertificationAddDialog()"></button>
   <button pButton label="Add" icon="pi pi-check" class="p-button-text" (click)="addCertification()"></button>
 </ng-template>
</p-dialog>
