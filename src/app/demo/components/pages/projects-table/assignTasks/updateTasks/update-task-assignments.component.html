<div class="surface-section p-4 md:p-6 lg:p-8">
  <p-toast></p-toast>
  <div class="font-medium text-3xl text-primary mb-4">
    <i class="pi pi-user-plus mr-2" style="font-size: 40px;"></i>
    Assignments for Task ID: {{ taskId }}
  </div>

  <!-- Loader -->
  <p-progressSpinner *ngIf="isLoading"></p-progressSpinner>

  <!-- Show table and add button only if not editing, not adding, and not loading -->
  <div *ngIf="!isLoading && !showEditDialog && !showAddDialog">
    <!-- Add Assignment Button -->
    <div class="mt-4 mb-4">
      <button
        pButton
        pRipple
        label="Add Assignment"
        icon="pi pi-plus"
        class="p-button-success"
        (click)="startAddAssignment()"
      ></button>
    </div>

    <!-- Assignments Table -->
    <p-table [value]="assignments" [paginator]="true" [rows]="10">
      <ng-template pTemplate="header">
        <tr>
          <th>Employee ID</th>
          <th>Equipment ID</th>
          <th>Assigned Date</th>
          <th>Completion Date</th>
          <th>Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-assignment>
        <tr>
          <td>{{ assignment.employee_id }}</td>
          <td>{{ assignment.equipment_id }}</td>
          <td>{{ assignment.assigned_date }}</td>
          <td>{{ assignment.completion_date }}</td>
          <td>
            <!-- Edit Button -->
            <button
              pButton
              pRipple
              label="Edit"
              icon="pi pi-pencil"
              class="p-button-rounded p-button-warning mr-2"
              (click)="editAssignment(assignment.id)"
            ></button>

            <!-- Delete Button -->
            <button
              pButton
              pRipple
              label="Delete"
              icon="pi pi-trash"
              class="p-button-rounded p-button-danger"
              (click)="deleteAssignment(assignment.id)"
            ></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <!-- Edit Form (Displayed when showEditDialog is true) -->
  <div *ngIf="!isLoading && showEditDialog" class="edit-form-container" style="max-width: 600px; margin: 0 auto;">
    <h3 class="text-2xl font-medium mb-4">Edit Assignment</h3>

    <div class="field mb-3">
      <label for="employee_id_edit" class="block font-medium mb-2">Employee</label>
      <p-dropdown
        [options]="employees"
        optionLabel="name"
        optionValue="id"
        [(ngModel)]="editedAssignment.employee_id"
        id="employee_id_edit"
        placeholder="Select an Employee"
        class="w-full"
      ></p-dropdown>
    </div>

    <div class="field mb-3">
      <label for="equipment_id_edit" class="block font-medium mb-2">Equipment</label>
      <p-dropdown
        [options]="equipments"
        optionLabel="name"
        optionValue="id"
        [(ngModel)]="editedAssignment.equipment_id"
        id="equipment_id_edit"
        placeholder="Select an Equipment"
        class="w-full"
      ></p-dropdown>
    </div>

    <div class="field mb-3">
      <label for="assigned_date_edit" class="block font-medium mb-2">Assigned Date</label>
      <input
        id="assigned_date_edit"
        pInputText
        type="date"
        [(ngModel)]="editedAssignment.assigned_date"
        class="w-full"
      />
    </div>

    <div class="field mb-3">
      <label for="completion_date_edit" class="block font-medium mb-2">Completion Date</label>
      <input
        id="completion_date_edit"
        pInputText
        type="date"
        [(ngModel)]="editedAssignment.completion_date"
        class="w-full"
      />
    </div>

    <!-- Status is read-only in edit -->
    <div class="field mb-3">
      <label for="status_edit" class="block font-medium mb-2">Status</label>
      <span id="status_edit" class="w-full block py-2 bg-gray-100 rounded">
        {{ editedAssignment.status }}
      </span>
    </div>

    <div class="flex justify-end mt-4">
      <button pButton label="Cancel" class="p-button-text mr-2" (click)="cancelEdit()"></button>
      <button pButton label="Save" class="p-button-primary" (click)="saveChanges()"></button>
    </div>
  </div>

  <!-- Add Form (Displayed when showAddDialog is true) -->
  <div *ngIf="!isLoading && showAddDialog" class="add-form-container" style="max-width: 600px; margin: 0 auto;">
    <h3 class="text-2xl font-medium mb-4">Add Assignment</h3>

    <div class="field mb-3">
      <label for="employee_id_add" class="block font-medium mb-2">Employee</label>
      <p-dropdown
        [options]="employees"
        optionLabel="name"
        optionValue="id"
        [(ngModel)]="newAssignment.employee_id"
        id="employee_id_add"
        placeholder="Select an Employee"
        class="w-full"
      ></p-dropdown>
    </div>

    <div class="field mb-3">
      <label for="equipment_id_add" class="block font-medium mb-2">Equipment</label>
      <p-dropdown
        [options]="equipments"
        optionLabel="name"
        optionValue="id"
        [(ngModel)]="newAssignment.equipment_id"
        id="equipment_id_add"
        placeholder="Select an Equipment"
        class="w-full"
      ></p-dropdown>
    </div>

    <div class="field mb-3">
      <label for="assigned_date_add" class="block font-medium mb-2">Assigned Date</label>
      <input
        id="assigned_date_add"
        pInputText
        type="date"
        [(ngModel)]="newAssignment.assigned_date"
        class="w-full"
      />
    </div>

    <div class="field mb-3">
      <label for="completion_date_add" class="block font-medium mb-2">Completion Date</label>
      <input
        id="completion_date_add"
        pInputText
        type="date"
        [(ngModel)]="newAssignment.completion_date"
        class="w-full"
      />
    </div>

    <!-- Status field removed here -->

    <div class="flex justify-end mt-4">
      <button pButton label="Cancel" class="p-button-text mr-2" (click)="cancelAdd()"></button>
      <button pButton label="Save" class="p-button-primary" (click)="confirmAdd()"></button>
    </div>
  </div>
</div>
